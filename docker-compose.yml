services:

  research-agent:
    build: .
    container_name: research-agent

    environment:
      HOME: /app/home
      HF_HOME: /app/home/.cache/huggingface

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    volumes:
      - huggingface_cache:/app/home/.cache/huggingface
      - ./results:/app/results
      - ./research_task.yml:/app/research_task.yml:ro

  searxng:
    image: searxng/searxng:latest
    container_name: searxng

    ports:
      - "8080:8080"

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  huggingface_cache: